server:
  port: ${PORT:8080}
spring:
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  # Optional legacy app-wide SMTP; connected IMAP/SMTP mailboxes use their own settings.
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
app:
  jwt-secret: ${JWT_SECRET}
  cookie-secure: ${COOKIE_SECURE:false}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
gemini:
  api-key: ${GEMINI_API_KEY:}
  model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
email:
  smtp:
    from: ${SMTP_FROM:}
# Optional legacy Gmail OAuth; Hostinger IMAP/SMTP needs no Google credentials.
google:
  oauth:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}

mailbox:
  encryption-key: ${MAIL_CREDENTIAL_ENCRYPTION_KEY:}
  allow-private-hosts: ${MAIL_ALLOW_PRIVATE_HOSTS:false}
